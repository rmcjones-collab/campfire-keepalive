name: Keep the Treeline Relay awake

on:
  schedule:
    # Off the top of the minute; GitHub runs schedules best-effort and may still delay or drop them.
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      check:
        description: "normal, or a forced failure to prove the red path"
        type: choice
        default: normal
        options: [normal, unreachable, stale]

permissions:
  contents: read

concurrency:
  group: ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Worst case is 3 x 40 s curl + 2 x 20 s sleep = 160 s; leave room so a hung relay exits 1, not cancelled.
    timeout-minutes: 5
    steps:
      - name: Ping the relay status endpoint
        # Fails unless the relay answers 200, is not paused and ticked recently, so green means healthy.
        env:
          STATUS_URL: https://campfire-treeline.pplx.app/port/8097/api/status${{ inputs.check == 'unreachable' && '/__red-path-test' || '' }}
          STALE_MINUTES: ${{ inputs.check == 'stale' && '0' || '15' }}
        run: |
          code=000
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/status.json -w "%{http_code}" --max-time 40 "$STATUS_URL" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && break
            [ "$attempt" -lt 3 ] && sleep 20
          done
          if [ "$code" != "200" ]; then
            echo "::error::Relay did not answer 200 after 3 attempts (last HTTP $code)"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          try:
              s = json.load(open("/tmp/status.json"))
          except ValueError:
              print("::error::Status endpoint returned 200 but not JSON"); sys.exit(1)
          print("last tick:", s.get("last_tick"), "| paused:", s.get("paused"), "| replies:", s.get("replies"), "| posts:", s.get("posts"), "| errors:", s.get("errors"))
          try:
              tick = datetime.fromisoformat(str(s.get("last_tick")))
              if tick.tzinfo is None:
                  raise ValueError("no timezone")
          except ValueError:
              print("::error::last_tick missing or unparseable"); sys.exit(1)
          age = (datetime.now(timezone.utc) - tick).total_seconds() / 60
          limit = float(os.environ["STALE_MINUTES"])
          print(f"tick age: {age:.1f} min (limit {limit:.0f})")
          if s.get("paused") is not False:
              print("::error::Relay reports paused (or no paused field)"); sys.exit(1)
          if age > limit:
              print(f"::error::Last tick is {age:.1f} min old (limit {limit:.0f} min)"); sys.exit(1)
          PY

  # GitHub disables cron workflows after 60 days without repository activity, so leave a small daily footprint.
  # Separate job so only this step gets write access; always() keeps it running when the relay check fails.
  heartbeat:
    needs: ping
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Daily heartbeat commit
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          today=$(date -u +%F)
          if [ "$(cat HEARTBEAT 2>/dev/null)" != "$today" ]; then
            echo "$today" > HEARTBEAT
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add HEARTBEAT
            git commit -q -m "heartbeat $today"
            git push -q
            echo "heartbeat committed for $today"
          else
            echo "heartbeat already recorded today"
          fi
